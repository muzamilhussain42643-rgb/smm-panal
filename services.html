<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services - SMM Panel</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<nav class="navbar">
    <div class="logo">SMM PANEL</div>

    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<main class="container">

    <h2>Our Services</h2>

    <div id="servicesList" class="cards">
        <p>Loading services...</p>
    </div>

</main>

<footer class="footer">
    <p>© 2026 SMM Panel. All Rights Reserved.</p>
</footer>

<script>

async function loadServices() {

    const servicesList =
        document.getElementById("servicesList");

    const { data, error } =
        await supabaseClient
        .from("services")
        .select("*")
        .eq("active", true)
        .order("id", { ascending: true });

    if (error) {
        console.error(error);

        servicesList.innerHTML =
            "<p>Unable to load services.</p>";

        return;
    }

    if (!data || data.length === 0) {
        servicesList.innerHTML =
            "<p>No services available.</p>";

        return;
    }

    servicesList.innerHTML = "";

    data.forEach(service => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <h3>${service.name}</h3>

            <p>
                <strong>Platform:</strong>
                ${service.platform}
            </p>

            <p>
                ${service.description || ""}
            </p>

            <p>
                <strong>Price:</strong>
                ₨${Number(service.price).toFixed(0)}
            </p>

            <p>
                <strong>Minimum:</strong>
                ${service.min_order}
            </p>

            <p>
                <strong>Maximum:</strong>
                ${service.max_order}
            </p>

            <button
                class="btn"
                onclick="orderService(${service.id})">
                Order Now
            </button>
        `;

        servicesList.appendChild(card);
    });
}

function orderService(serviceId) {
    window.location.href =
        "orders.html?service=" + serviceId;
}

loadServices();

</script>

</body>
</html>
