<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - SMM Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">SMM PANEL</div>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
        <a href="index.html">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="form-box">

        <h2>Place New Order</h2>

        <form id="orderForm">

            <label>Choose Service</label>

            <select id="service" required>
                <option value="">Select a service</option>
                <option>TikTok Promotion</option>
                <option>Instagram Promotion</option>
                <option>YouTube Promotion</option>
                <option>Facebook Promotion</option>
                <option>WhatsApp Promotion</option>
            </select>

            <label>Link</label>

            <input
                type="url"
                id="link"
                placeholder="https://..."
                required
            >

            <label>Quantity</label>

            <input
                type="number"
                id="quantity"
                placeholder="Enter quantity"
                min="1"
                required
            >

            <button type="submit" class="btn">
                Place Order
            </button>

        </form>

        <p id="orderMessage" style="margin-top:15px;"></p>

    </div>

    <h2 style="margin-top:40px;">
        My Orders
    </h2>

    <table>

        <thead>
            <tr>
                <th>Service</th>
                <th>Link</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="ordersTable">

            <tr>
                <td colspan="4" style="text-align:center;">
                    No orders yet
                </td>
            </tr>

        </tbody>

    </table>

</main>

<a
    class="whatsapp"
    href="https://wa.me/923156211226"
    target="_blank"
>
    WhatsApp Support
</a>

<footer class="footer">
    <p>© 2026 SMM Panel. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
