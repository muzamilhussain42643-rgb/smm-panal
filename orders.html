<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - SMM Panel</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<nav class="navbar">
    <div class="logo">SMM PANEL</div>

    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<main class="container">

    <div class="form-box">

        <h2>Place New Order</h2>

        <form id="orderForm">

            <label>Service</label>

            <select id="service" required>
                <option value="">Loading services...</option>
            </select>

            <label>Social Media Link</label>

            <input
                type="url"
                id="link"
                placeholder="https://..."
                required
            >

            <label>Quantity</label>

            <input
                type="number"
                id="quantity"
                min="1"
                placeholder="Enter quantity"
                required
            >

            <p>
                Price:
                <strong id="price">₨0</strong>
            </p>

            <p>
                Total:
                <strong id="total">₨0</strong>
            </p>

            <button type="submit" class="btn">
                Place Order
            </button>

        </form>

        <p id="message"></p>

    </div>

</main>

<script>

let services = [];

const serviceSelect =
    document.getElementById("service");

const quantityInput =
    document.getElementById("quantity");

const priceText =
    document.getElementById("price");

const totalText =
    document.getElementById("total");

const orderForm =
    document.getElementById("orderForm");

const message =
    document.getElementById("message");


async function loadServices() {

    const { data, error } =
        await supabaseClient
        .from("services")
        .select("*")
        .eq("active", true)
        .order("id");

    if (error) {
        console.error(error);
        serviceSelect.innerHTML =
            '<option value="">Unable to load services</option>';
        return;
    }

    services = data || [];

    serviceSelect.innerHTML =
        '<option value="">Select a service</option>';

    services.forEach(service => {

        const option =
            document.createElement("option");

        option.value = service.id;

        option.textContent =
            `${service.name} — ₨${Number(service.price).toFixed(0)}`;

        serviceSelect.appendChild(option);
    });
}


function calculateTotal() {

    const selectedId =
        Number(serviceSelect.value);

    const service =
        services.find(s => s.id === selectedId);

    const quantity =
        Number(quantityInput.value);

    if (!service) {
        priceText.textContent = "₨0";
        totalText.textContent = "₨0";
        return;
    }

    priceText.textContent =
        `₨${Number(service.price).toFixed(0)}`;

    const total =
        Number(service.price) * quantity;

    totalText.textContent =
        `₨${Number(total).toFixed(0)}`;
}


serviceSelect.addEventListener(
    "change",
    calculateTotal
);

quantityInput.addEventListener(
    "input",
    calculateTotal
);


orderForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.textContent = "";

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            message.textContent =
                "Please login before placing an order.";

            return;
        }

        const serviceId =
            Number(serviceSelect.value);

        const service =
            services.find(s => s.id === serviceId);

        const link =
            document.getElementById("link").value.trim();

        const quantity =
            Number(quantityInput.value);

        if (!service) {
            message.textContent =
                "Please select a service.";

            return;
        }

        if (
            quantity < service.min_order ||
            quantity > service.max_order
        ) {
            message.textContent =
                `Quantity must be between ${service.min_order} and ${service.max_order}.`;

            return;
        }

        const amount =
            Number(service.price) * quantity;

        const {
            error
        } = await supabaseClient
            .from("orders")
            .insert({
                user_id: user.id,
                service_id: service.id,
                link: link,
                quantity: quantity,
                amount: amount,
                status: "Pending"
            });

        if (error) {
            console.error(error);

            message.textContent =
                "Order could not be placed.";

            return;
        }

        message.textContent =
            "Order placed successfully!";

        orderForm.reset();

        priceText.textContent = "₨0";
        totalText.textContent = "₨0";
    }
);


loadServices();

</script>

</body>
</html>
