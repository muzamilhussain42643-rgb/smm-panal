<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - SMM Panel</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>

<nav class="navbar">
    <div class="logo">SMM PANEL ADMIN</div>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="my-orders.html">My Orders</a>
        <a href="payment.html">Payments</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<main class="container">

    <h1>Admin Panel</h1>
    <p id="adminMessage">Checking admin access...</p>

    <div id="adminContent" style="display:none;">

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p id="userCount">0</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p id="orderCount">0</p>
            </div>

            <div class="card">
                <h3>Pending Orders</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="card">
                <h3>Pending Payments</h3>
                <p id="paymentCount">0</p>
            </div>

        </div>

        <div class="card" style="margin-top:30px;">
            <h2>Quick Actions</h2>

            <p>Admin dashboard is ready.</p>

            <a href="services.html" class="btn">
                Manage Services
            </a>

            <a href="my-orders.html" class="btn">
                View Orders
            </a>

            <a href="payment.html" class="btn">
                View Payments
            </a>
        </div>

    </div>

</main>

<script>

async function checkAdmin() {

    const message =
        document.getElementById("adminMessage");

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const {
        data: admin,
        error: adminError
    } = await supabaseClient
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError) {
        console.error(adminError);
        message.textContent =
            "Unable to verify admin access.";
        return;
    }

    if (!admin) {
        message.textContent =
            "Access denied. Admin only.";
        return;
    }

    message.textContent =
        "Welcome Admin: " + user.email;

    document.getElementById("adminContent")
        .style.display = "block";

    loadStats();
}


async function loadStats() {

    const { count: orders } =
        await supabaseClient
        .from("orders")
        .select("*", {
            count: "exact",
            head: true
        });

    const { count: pending } =
        await supabaseClient
        .from("orders")
        .select("*", {
            count: "exact",
            head: true
        })
        .eq("status", "Pending");

    const { count: payments } =
        await supabaseClient
        .from("payments")
        .select("*", {
            count: "exact",
            head: true
        })
        .eq("status", "Pending");

    document.getElementById("orderCount")
        .textContent = orders || 0;

    document.getElementById("pendingCount")
        .textContent = pending || 0;

    document.getElementById("paymentCount")
        .textContent = payments || 0;

    /*
      Supabase Auth users cannot safely be counted
      from the browser with the public key.
    */

    document.getElementById("userCount")
        .textContent = "—";
}


checkAdmin();

</script>

</body>
</html>
