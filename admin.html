<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SMM Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">SMM PANEL ADMIN</div>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="orders.html">Orders</a>
        <a href="index.html">Website</a>
    </div>
</nav>

<main class="container">

    <section class="hero">
        <h1>Admin Dashboard</h1>
        <p>Manage your SMM Panel.</p>
    </section>

    <div class="cards">

        <div class="card">
            <h3>👥 Users</h3>
            <p>Total Users</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <h3>📦 Orders</h3>
            <p>Total Orders</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <h3>💰 Payments</h3>
            <p>Pending Payments</p>
            <h2>0</h2>
        </div>

    </div>

    <div class="card" style="margin-top:25px;">

        <h2>Recent Orders</h2>

        <table>

            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Service</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td colspan="4" style="text-align:center;">
                        No orders available
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>

<footer class="footer">
    <p>© 2026 SMM Panel Admin</p>
</footer>

</body>
</html>
